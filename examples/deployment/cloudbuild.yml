# Runs repository checks and creates a local bundle in the Cloud Build workspace.
# Remote sync must be explicitly requested separately.
steps:
  - id: validate-payload
    name: node:22
    entrypoint: npm
    args: ['run', 'validate:payload']

  - id: security-scan
    name: node:22
    entrypoint: npm
    args: ['run', 'security:scan']

  - id: test
    name: node:22
    entrypoint: npm
    args: ['test']

  - id: build-sync-bundle
    name: node:22
    entrypoint: npm
    args: ['run', 'sync', '--', '--snapshot', '--output', 'dist/ecosystem-sync.json']

options:
  logging: CLOUD_LOGGING_ONLY


name: Verify Dune-Sub integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test validation, scanning, and guarded synchronization
        run: npm run check
      - name: Create and verify synchronization bundle
        run: |
          npm run sync -- --output dist/ecosystem-sync.json
          npm run validate:payload -- --bundle dist/ecosystem-sync.json
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-sync-bundle
          path: dist/ecosystem-sync.json
          if-no-files-found: error

  configuration-and-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document and YAML tools
        run: python -m pip install -r requirements.txt PyYAML==6.0.3
      - name: Parse all build configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          names = [*Path('.github/workflows').glob('*.yml'), Path('examples/deployment/cloudbuild.yml'), Path('examples/exo-sync-validation.yml.example')]
          for name in names:
              yaml.safe_load(Path(name).read_text())
              print(f'YAML syntax passed: {name}')
          PY
      - name: Generate the blueprint document
        run: python scripts/generate_blueprint.py --output "$RUNNER_TEMP/Ecosystem-Blueprint.docx"

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the ACL contract
        run: npm exec --yes --package=solc@0.8.30 -- solcjs --bin --abi -o "$RUNNER_TEMP/contracts" contracts/node_acl_smart_contract.sol

  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/seo-agent/package-lock.json
      - name: Install pinned Worker tooling
        run: npm run seo:install
      - name: Typecheck, test, and verify Worker HTTP, D1, and KV integration
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_LOG_PATH: ${{ runner.temp }}/seo-agent-wrangler.log
          XDG_CONFIG_HOME: ${{ runner.temp }}/seo-agent-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/.wrangler"
          npm run seo:verify
          npm run seo:injector:build
          npm run seo:injector:smoke

  yubikey-piv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-provider dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig
          python -m pip install -r requirements-yubikey.txt
      - name: Test attestation, envelope encryption and private host bridge
        run: python -m unittest discover -s test -p 'test_yubikey*.py' -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive config
      - name: Initialize the pinned Google provider
        run: terraform -chdir=config init -backend=false -input=false
      - name: Validate the CMEK organization policy
        run: terraform -chdir=config validate -no-color
